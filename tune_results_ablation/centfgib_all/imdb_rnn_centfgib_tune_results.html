<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>调参结果</title>
<style>
body { font-family: sans-serif; margin: 2em; }
h1 { font-size: 1.4em; }
h2 { font-size: 1.1em; margin-top: 1.6em; }
table { border-collapse: collapse; }
th, td { border: 1px solid #999; padding: 6px 12px; text-align: center; }
th { background: #eee; }
tr.best { background: #dfd; font-weight: bold; }
.meta { color: #555; margin-bottom: 1em; }
.sort-row { margin-bottom: 0.5em; }
</style>
</head>
<body>
<h1>调参结果</h1>
<div class="meta">task=imdb backbone=rnn model=centfgib runs=5 epochs=100 | 1 组组合（绿色高亮 = 各模型默认指标 Acc 的最佳行）</div>

<h2>centfgib</h2>
<div class="sort-row">排序指标：
<select class="sort-select" data-table="table-centfgib">
<option value="Loss">Loss</option><option value="Acc" selected>Acc</option><option value="AUC">AUC</option><option value="Pre">Pre</option><option value="Rec">Rec</option>
</select>
（Acc/AUC/Pre/Rec/R2 降序，Loss/MAE 升序）</div>
<table id="table-centfgib">
<thead><tr><th>beta</th><th>anchor_scale</th><th>Loss</th><th>Acc</th><th>AUC</th><th>Pre</th><th>Rec</th></tr></thead>
<tbody>
<tr class="best" data-loss="0.5006" data-acc="0.8539" data-auc="0.9288" data-pre="0.8545" data-rec="0.8539"><td>0.0001</td><td>16</td><td>0.5006±0.2447</td><td>0.8539±0.0031</td><td>0.9288±0.0056</td><td>0.8545±0.0034</td><td>0.8539±0.0031</td></tr>
</tbody>
</table>

<script>
function sortTable(tableId, key) {
  const tbody = document.getElementById(tableId).querySelector("tbody");
  const rows = Array.from(tbody.querySelectorAll("tr"));
  const ascending = key === "Loss" || key === "MAE";
  rows.sort((a, b) => {
    const k = key.toLowerCase();
    const va = parseFloat(a.dataset[k]);
    const vb = parseFloat(b.dataset[k]);
    const fa = isNaN(va) ? (ascending ? Infinity : -Infinity) : va;
    const fb = isNaN(vb) ? (ascending ? Infinity : -Infinity) : vb;
    return ascending ? fa - fb : fb - fa;
  });
  rows.forEach(r => tbody.appendChild(r));
}
document.querySelectorAll(".sort-select").forEach(sel => {
  sel.addEventListener("change", () => sortTable(sel.dataset.table, sel.value));
});
</script>
</body>
</html>
